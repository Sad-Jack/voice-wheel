[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-wheel"
version = "0.1.0"
description = "AI Voice Clipboard — hold a key, speak, pick a mode around the cursor, paste a finished result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pynput>=1.7.7",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "mlx-whisper>=0.4.0",
    "faster-whisper>=1.0.0",
    "anthropic>=0.40.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.scripts]
voice-wheel = "voice_wheel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_wheel = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (real bugs: unused imports, undefined names),
# I = import sorting, W = warnings, UP = pyupgrade, B = bugbear (likely bugs).
select = ["E", "F", "I", "W", "UP", "B"]
# E501 (long lines) and E702 (compact `a(); b(); c()` draw calls) are an
# intentional style in the PyObjC drawing code; UP042 (StrEnum) would change
# Ring's semantics.
ignore = ["E501", "E702", "UP042"]
