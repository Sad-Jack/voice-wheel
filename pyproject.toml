[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-wheel"
version = "0.1.0"
description = "AI Voice Clipboard — hold a key, speak, pick a mode around the cursor, paste a finished result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pynput>=1.7.7",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "mlx-whisper>=0.4.0",
    "faster-whisper>=1.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
voice-wheel = "voice_wheel.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_wheel = ["py.typed"]
